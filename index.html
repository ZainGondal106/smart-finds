<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee & Task Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas for downloading table image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdf4ff 0%, #fff7ed 50%, #fef2f2 100%);
            min-height: 100vh;
        }
        .excel-table th, .excel-table td {
            border: 1px solid #e5e7eb;
        }
        /* Class applied during image capture to hide checkboxes and action buttons */
        .capturing .hide-on-capture {
            display: none !important;
        }
        .capturing .table-container {
            box-shadow: none !important;
            border: none !important;
        }
    </style>
</head>
<body class="text-gray-800 p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-ext500 font-bold bg-gradient-to-r from-purple-600 via-red-500 to-orange-500 bg-clip-text text-transparent">
                Fee & Task Manager
            </h1>
            <p class="text-gray-600 text-sm mt-1">Excel-style tracking made fast and simple</p>
        </header>

        <!-- Input Form Card -->
        <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-5 sm:p-6 mb-8 border border-purple-100">
            <h2 class="text-lg font-semibold text-purple-900 mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span> Add New Record
            </h2>
            <form id="recordForm" class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-end">
                <div class="sm:col-span-5">
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">User Name / Description</label>
                    <input type="text" id="userName" required placeholder="e.g. Tuition, Van, Ali..." 
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-50/50 text-sm">
                </div>
                <div class="sm:col-span-3">
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Date</label>
                    <input type="date" id="recordDate" required 
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-50/50 text-sm">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Payment (Rs.)</label>
                    <input type="number" id="recordPayment" required placeholder="0" 
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-50/50 text-sm">
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-600 to-orange-500 hover:from-purple-700 hover:to-orange-600 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-purple-500/20 transition-all duration-200 text-sm flex items-center justify-center gap-2">
                        <span>Add</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Navigation Tabs & Actions -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
            <div class="flex bg-white/80 p-1.5 rounded-2xl shadow-sm border border-purple-100 w-full sm:w-auto">
                <button id="tabActive" onclick="switchTab('active')" 
                    class="flex-1 sm:flex-none px-6 py-2 rounded-xl text-sm font-semibold transition-all bg-gradient-to-r from-purple-600 to-orange-500 text-white shadow-md">
                    Active Records
                </button>
                <button id="tabDone" onclick="switchTab('done')" 
                    class="flex-1 sm:flex-none px-6 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-purple-600 transition-all">
                    Done Records
                </button>
            </div>
            
            <button onclick="downloadTableImage()" 
                class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-white font-medium px-5 py-2.5 rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span>Download Table Image</span>
            </button>
        </div>

        <!-- Table Container -->
        <div id="captureArea" class="table-container bg-white rounded-2xl shadow-xl overflow-hidden border border-purple-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse excel-table text-sm">
                    <thead>
                        <tr class="bg-purple-900 text-white uppercase text-xs tracking-wider">
                            <th class="py-3 px-4 w-12 text-center hide-on-capture">Done</th>
                            <th class="py-3 px-4 header-user-title">USERS</th>
                            <th class="py-3 px-4 w-36">Date</th>
                            <th class="py-3 px-4 w-40 text-right">Payment Amount</th>
                            <th class="py-3 px-4 w-28 text-center hide-on-capture">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 bg-white">
                        <!-- Dynamic Rows -->
                    </tbody>
                    <tfoot>
                        <tr class="bg-purple-50/80 font-bold text-gray-900 border-t-2 border-purple-200">
                            <td colspan="3" class="py-3 px-4 text-right uppercase text-xs tracking-wider hide-on-capture">Total:</td>
                            <td class="py-3 px-4 text-right uppercase text-xs tracking-wider hide-on-capture-col sm:table-cell" id="totalLabelCell">Total:</td>
                            <td class="py-3 px-4 text-right text-purple-900 font-extrabold text-base" id="tableTotal">Rs. 0</td>
                            <td class="hide-on-capture"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Set today's date as default in input
        document.getElementById('recordDate').valueAsDate = new Date();

        let records = JSON.parse(localStorage.getItem('fee_manager_records')) || [];
        let currentTab = 'active';

        function saveData() {
            localStorage.setItem('fee_manager_records', JSON.stringify(records));
        }

        function switchTab(tab) {
            currentTab = tab;
            const btnActive = document.getElementById('tabActive');
            const btnDone = document.getElementById('tabDone');
            if (tab === 'active') {
                btnActive.className = "flex-1 sm:flex-none px-6 py-2 rounded-xl text-sm font-semibold transition-all bg-gradient-to-r from-purple-600 to-orange-500 text-white shadow-md";
                btnDone.className = "flex-1 sm:flex-none px-6 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-purple-600 transition-all";
            } else {
                btnDone.className = "flex-1 sm:flex-none px-6 py-2 rounded-xl text-sm font-semibold transition-all bg-gradient-to-r from-purple-600 to-orange-500 text-white shadow-md";
                btnActive.className = "flex-1 sm:flex-none px-6 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-purple-600 transition-all";
            }
            renderTable();
        }

        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const date = document.getElementById('recordDate').value;
            const payment = parseFloat(document.getElementById('recordPayment').value) || 0;

            if(!name) return;

            const newRecord = {
                id: Date.now(),
                name,
                date,
                payment,
                done: false,
                isEditing: false
            };

            records.push(newRecord);
            saveData();
            renderTable();

            // Reset form inputs except date
            document.getElementById('userName').value = '';
            document.getElementById('recordPayment').value = '';
            document.getElementById('userName').focus();
        });

        function toggleDone(id) {
            records = records.map(r => r.id === id ? { ...r, done: !r.done, isEditing: false } : r);
            saveData();
            renderTable();
        }

        function deleteRecord(id) {
            if(confirm('Are you sure you want to delete this record?')) {
                records = records.filter(r => r.id !== id);
                saveData();
                renderTable();
            }
        }

        function toggleEdit(id) {
            records = records.map(r => r.id === id ? { ...r, isEditing: !r.isEditing } : r);
            renderTable();
        }

        function saveEdit(id) {
            const row = document.getElementById(`row-${id}`);
            const nameInput = row.querySelector('.edit-name').value.trim();
            const dateInput = row.querySelector('.edit-date').value;
            const paymentInput = parseFloat(row.querySelector('.edit-payment').value) || 0;

            if(!nameInput) return;

            records = records.map(r => r.id === id ? {
                ...r,
                name: nameInput,
                date: dateInput,
                payment: paymentInput,
                isEditing: false
            } : r);

            saveData();
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const filtered = records.filter(r => currentTab === 'active' ? !r.done : r.done);

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-400 italic">No records found.</td></tr>`;
                document.getElementById('tableTotal').innerText = 'Rs. 0';
                return;
            }

            let total = 0;

            filtered.forEach(r => {
                total += r.payment;
                const tr = document.createElement('tr');
                tr.id = `row-${r.id}`;
                tr.className = "hover:bg-purple-50/30 transition-colors";

                if (r.isEditing) {
                    tr.innerHTML = `
                        <td class="py-3 px-4 text-center hide-on-capture">
                            <input type="checkbox" ${r.done ? 'checked' : ''} onchange="toggleDone(${r.id})" class="rounded text-purple-600 focus:ring-purple-500 h-4 w-4">
                        </td>
                        <td class="py-3 px-4">
                            <input type="text" value="${r.name}" class="edit-name w-full px-2 py-1 border rounded text-sm focus:ring-2 focus:ring-purple-500">
                        </td>
                        <td class="py-3 px-4">
                            <input type="date" value="${r.date}" class="edit-date w-full px-2 py-1 border rounded text-sm focus:ring-2 focus:ring-purple-500">
                        </td>
                        <td class="py-3 px-4 text-right">
                            <input type="number" value="${r.payment}" class="edit-payment w-28 px-2 py-1 border rounded text-sm text-right focus:ring-2 focus:ring-purple-500">
                        </td>
                        <td class="py-3 px-4 text-center hide-on-capture">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="saveEdit(${r.id})" class="text-xs bg-green-500 hover:bg-green-600 text-white px-2.5 py-1 rounded shadow">Save</button>
                                <button onclick="toggleEdit(${r.id})" class="text-xs bg-gray-300 hover:bg-gray-400 text-gray-700 px-2.5 py-1 rounded">Cancel</button>
                            </div>
                        </td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td class="py-3 px-4 text-center hide-on-capture">
                            <input type="checkbox" ${r.done ? 'checked' : ''} onchange="toggleDone(${r.id})" class="rounded text-purple-600 focus:ring-purple-500 h-4 w-4 cursor-pointer">
                        </td>
                        <td class="py-3 px-4 font-medium text-gray-800">${escapeHtml(r.name)}</td>
                        <td class="py-3 px-4 text-gray-600 text-sm">${r.date}</td>
                        <td class="py-3 px-4 text-right font-semibold text-gray-900">Rs. ${r.payment.toLocaleString()}</td>
                        <td class="py-3 px-4 text-center hide-on-capture">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="toggleEdit(${r.id})" class="text-xs bg-purple-100 hover:bg-purple-200 text-purple-700 px-2.5 py-1 rounded font-medium transition">Edit</button>
                                <button onclick="deleteRecord(${r.id})" class="text-xs bg-red-100 hover:bg-red-200 text-red-600 px-2.5 py-1 rounded font-medium transition">Delete</button>
                            </div>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });

            document.getElementById('tableTotal').innerText = `Rs. ${total.toLocaleString()}`;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function downloadTableImage() {
            const captureArea = document.getElementById('captureArea');
            captureArea.classList.add('capturing');
            
            // Temporarily update header for capture
            const headerTitle = document.querySelector('.header-user-title');
            const originalHeaderText = headerTitle.innerText;
            headerTitle.innerText = "USERS";

            html2canvas(captureArea, {
                scale: 2,
                backgroundColor: '#ffffff',
                logging: false
            }).then(canvas => {
                captureArea.classList.remove('capturing');
                headerTitle.innerText = originalHeaderText;

                const link = document.createElement('a');
                link.download = `Fee_Manager_${currentTab}_table.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                captureArea.classList.remove('capturing');
                headerTitle.innerText = originalHeaderText;
                console.error("Image generation failed:", err);
                alert("Failed to download image. Please try again.");
            });
        }

        // Initial render
        renderTable();
    </script>
</body>
</html>
